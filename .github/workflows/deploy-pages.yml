# Deploy the Computer Networks course site to GitHub Pages.
#
# Pipeline: generate the site tree from course sources (student-visible only),
# then build with MkDocs in strict mode. Any generation or build failure fails
# the workflow — failures are never silently ignored.
#
# One-time manual setup (Settings → Pages): Source = GitHub Actions.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; keep the latest run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate site tree from course sources
        run: python tools/scripts/build_site_docs.py

      - name: Build site (strict)
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
